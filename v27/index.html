<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>角色动作对比问卷</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css?v=27">
  <script defer src="study-data.js?v=27"></script>
  <script defer src="trios.js?v=27"></script>
  <script defer src="answer-export.js?v=27"></script>
  <script defer src="app.js?v=27"></script>
</head>
<body>
  <header id="study-header" class="site-header" hidden>
    <div class="page-width header-inner">
      <div class="site-identity">
        <h1>角色动作对比问卷</h1>
      </div>
      <div id="progress-display" hidden>
        <progress id="progress" class="study-progress" aria-label="答题进度"></progress>
        <span id="progress-count" aria-hidden="true"></span>
      </div>
    </div>
  </header>

  <main class="page-width">
    <section id="trial-screen" class="trial-layout" aria-label="当前题目" hidden>
      <section id="candidates" class="panel" aria-label="待比较的视频"></section>
      <section class="panel response-panel" aria-label="你的选择">
        <div id="answers"></div>
      </section>
      <nav class="question-nav" aria-label="题目导航">
        <button id="previous" class="button" type="button">上一题</button>
        <button id="continue" class="button button-primary" type="button" disabled>下一题</button>
      </nav>
      <p id="feedback" class="status" role="status"></p>
    </section>

    <section id="finish-screen" aria-label="问卷已完成" hidden>
      <div id="fireworks" aria-hidden="true"></div>
      <div class="finish-actions">
        <p id="finish-status" role="status" aria-live="polite" aria-atomic="true"></p>
        <button id="download-csv" class="button button-primary" type="button">下载 CSV</button>
        <div id="wechat-export" hidden>
          <p>要保存 CSV，请复制下载链接，粘贴到手机浏览器的地址栏。链接中含有你的答案</p>
          <button id="copy-link" class="button button-primary" type="button">复制下载链接</button>
          <button id="share-file" class="button" type="button" hidden>分享 CSV 文件</button>
          <button id="copy-answers" class="button" type="button">复制答卷内容</button>
          <textarea id="manual-copy" rows="4" readonly hidden></textarea>
          <p id="backup-status" class="status" role="status"></p>
        </div>
      </div>
    </section>

    <footer id="save-status" class="save-tools" hidden>
      <p id="sync-status" role="status"></p>
    </footer>
    <noscript><p>请启用 JavaScript，以便播放视频并保存答案</p></noscript>
  </main>
</body>
</html>
