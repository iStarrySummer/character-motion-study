<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Character Motion Study</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
  <script defer src="study-data.js"></script>
  <script defer src="trios.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="page-width header-inner">
      <div class="site-identity">
        <h1>Character Motion Study</h1>
      </div>
      <div id="progress-display" hidden>
        <progress id="progress" class="study-progress" aria-label="Question progress"></progress>
        <span id="progress-count" aria-hidden="true"></span>
      </div>
    </div>
  </header>

  <main class="page-width">
    <section id="start-screen" class="panel standalone-panel" aria-labelledby="start-title">
      <h2 id="start-title">Study setup</h2>
      <p>Watch silent clips and compare facial expressions and head movements</p>
      <form id="start-form">
        <div class="setup-fields">
          <label for="form-picker">Assigned form
            <select id="form-picker" name="form">
              <option value="1">Form 1</option>
              <option value="2">Form 2</option>
              <option value="3">Form 3</option>
            </select>
          </label>
          <label for="participant-id">Participant ID
            <input id="participant-id" name="participant_id" type="text" placeholder="For example, P001" autocomplete="off" spellcheck="false" required>
          </label>
        </div>
        <p id="start-status" class="status" role="status"></p>
        <div class="button-group">
          <button id="start-study" class="button button-primary" type="submit">Start study</button>
          <button id="start-preview" class="button" type="button">Open preview</button>
        </div>
      </form>
    </section>

    <section id="trial-screen" class="trial-layout" aria-label="Study question" hidden>
      <aside id="guidance" class="panel guidance-panel" aria-label="Instructions">
        <div id="step-list"></div>
        <div class="navigation-block">
          <p id="feedback" class="status" role="status"></p>
          <nav class="question-nav" aria-label="Question navigation">
            <button id="previous" class="button" type="button">Previous</button>
            <button id="continue" class="button button-primary" type="button" disabled>Next</button>
          </nav>
        </div>
      </aside>
      <div class="question-content">
        <section id="candidates" class="panel" aria-label="Videos to judge"></section>
        <section id="answers" class="panel answers-panel" aria-label="Your answers"></section>
      </div>
    </section>

    <section id="finish-screen" class="panel standalone-panel" aria-labelledby="finish-title" hidden>
      <h2 id="finish-title">Session complete</h2>
      <p id="finish-message" role="status"></p>
      <div class="button-group">
        <button id="download-csv" class="button button-primary" type="button">Download CSV</button>
        <button id="download-json" class="button" type="button">Download JSON</button>
        <button id="return-home" class="button" type="button">Back to setup</button>
      </div>
    </section>

    <noscript><p>This study needs JavaScript to show the clips and save answers</p></noscript>
  </main>
</body>
</html>
