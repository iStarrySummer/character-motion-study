<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Character Motion Study</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css?v=21">
  <script defer src="study-data.js?v=21"></script>
  <script defer src="trios.js?v=21"></script>
  <script defer src="app.js?v=21"></script>
</head>
<body>
  <header class="site-header">
    <div class="page-width header-inner">
      <div class="site-identity">
        <h1>Character Motion Study</h1>
      </div>
      <div id="progress-display" hidden>
        <progress id="progress" class="study-progress" aria-label="Question progress"></progress>
        <span id="progress-count" aria-hidden="true"></span>
      </div>
    </div>
  </header>

  <main class="page-width">
    <section id="trial-screen" class="trial-layout" aria-label="Study question" hidden>
      <aside id="guidance" class="panel guidance-panel" aria-label="Instructions">
        <h2>What to look for</h2>
        <p>Watch the red-framed reference in the middle. Compare its head turns and facial expressions with A and B.</p>
        <div class="navigation-block">
          <p id="feedback" class="status" role="status"></p>
          <nav class="question-nav" aria-label="Question navigation">
            <button id="previous" class="button" type="button">Previous</button>
            <button id="continue" class="button button-primary" type="button" disabled>Next</button>
          </nav>
        </div>
      </aside>
      <div class="question-content">
        <section id="candidates" class="panel" aria-label="Videos to judge"></section>
        <section id="answers" class="panel answers-panel" aria-label="Your answers"></section>
      </div>
    </section>

    <section id="finish-screen" class="panel standalone-panel" aria-labelledby="finish-title" hidden>
      <h2 id="finish-title">Session complete</h2>
      <p id="finish-message" role="status"></p>
      <div class="button-group">
        <button id="download-csv" class="button button-primary" type="button">Download CSV</button>
        <button id="download-json" class="button" type="button">Download JSON</button>
        <button id="new-session" class="button" type="button">Start a new participant</button>
      </div>
    </section>

    <footer class="save-tools">
      <p id="sync-status" role="status"></p>
      <button id="partial-csv" class="button" type="button" disabled>Download CSV</button>
    </footer>
    <noscript><p>This study needs JavaScript to show the clips and save answers</p></noscript>
  </main>
</body>
</html>
