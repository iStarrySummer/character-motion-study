<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Character Motion Study</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css?v=24">
  <script defer src="study-data.js?v=24"></script>
  <script defer src="trios.js?v=24"></script>
  <script defer src="app.js?v=24"></script>
</head>
<body>
  <header id="study-header" class="site-header" hidden>
    <div class="page-width header-inner">
      <div class="site-identity">
        <h1>Character Motion Study</h1>
      </div>
      <div id="progress-display" hidden>
        <progress id="progress" class="study-progress" aria-label="Question progress"></progress>
        <span id="progress-count" aria-hidden="true"></span>
      </div>
    </div>
  </header>

  <main class="page-width">
    <section id="trial-screen" class="trial-layout" aria-label="Study question" hidden>
      <section id="candidates" class="panel" aria-label="Videos to judge"></section>
      <section class="panel response-panel" aria-label="Your answer">
        <div id="answers"></div>
      </section>
      <nav class="question-nav" aria-label="Question navigation">
        <button id="previous" class="button" type="button">Previous</button>
        <button id="continue" class="button button-primary" type="button" disabled>Next</button>
      </nav>
      <p id="feedback" class="status" role="status"></p>
    </section>

    <section id="finish-screen" aria-label="Completed questionnaire" hidden>
      <button id="download-csv" class="button button-primary" type="button">Download CSV</button>
    </section>

    <footer id="save-status" class="save-tools" hidden>
      <p id="sync-status" role="status"></p>
    </footer>
    <noscript><p>This study needs JavaScript to show the clips and save answers</p></noscript>
  </main>
</body>
</html>
