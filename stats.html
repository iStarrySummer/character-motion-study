<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>问卷结果 · 角色动作对比问卷</title>
  <link rel="stylesheet" href="style.css?v=25"><script src="stats.js?v=25" defer></script>
  <style>
    main.results { max-width: 1030px; } .results section { margin: 16px 0; }
    .results form { display: flex; flex-wrap: wrap; align-items: end; gap: 10px; }
    .results label { display: grid; gap: 6px; } .results input { min-height: 40px; padding: 4px 10px; }
    .results table { width: 100%; border-collapse: collapse; margin-top: 12px; }
    .results td,.results th { text-align: left; padding: 8px; border-bottom: 1px solid var(--line); }
    .results h2 { margin-bottom: 8px; } .scroll-table { overflow-x:auto; }
  </style>
</head>
<body><main class="page-width results">
  <h1>问卷结果</h1>
  <section class="panel"><form id="access"><label>研究者密钥<input id="key" type="password" required autocomplete="current-password"></label>
    <button class="button button-primary">查看结果</button></form><p id="status" role="status"></p></section>
  <div id="results" hidden><section class="panel"><h2>参与情况</h2><p id="totals"></p></section>
    <section class="panel"><h2>各组选择情况</h2><p>统计包含尚未完成问卷的参与者已保存的答案。每人每题只计一次，以最后一次选择为准。</p>
    <div class="scroll-table"><table><thead><tr><th>角色</th><th>比较类型</th><th>基准设置</th><th>测试设置</th><th>测试设置获选比例</th></tr></thead><tbody id="groups"></tbody></table></div></section>
    <section class="panel"><h2>每题选择情况</h2><div class="scroll-table"><table><thead><tr><th>题号</th><th>角色</th><th>场景</th><th>基准设置</th><th>测试设置</th><th>测试设置获选比例</th></tr></thead><tbody id="items"></tbody></table></div></section>
  </div>
</main></body></html>
